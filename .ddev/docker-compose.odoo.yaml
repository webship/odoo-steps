# Odoo 17.0 Community and PostgreSQL as additional DDEV services. DDEV has no
# project type for Odoo, so the two containers are declared here; see
# https://docs.ddev.com/en/stable/users/extend/custom-compose-files/
services:
  postgres:
    container_name: "ddev-${DDEV_SITENAME}-postgres"
    image: postgres:15-alpine
    restart: "no"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - "odoo-db:/var/lib/postgresql/data"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}

  odoo:
    container_name: "ddev-${DDEV_SITENAME}-odoo"
    image: odoo:17.0
    restart: "no"
    depends_on:
      - postgres
    environment:
      # The image's entrypoint turns these three into the database options.
      - HOST=postgres
      - USER=odoo
      - PASSWORD=odoo
      # The project name, for scripts/build-odoo.sh.
      - DDEV_SITENAME=${DDEV_SITENAME}
      # The DDEV router serves Odoo's port 8069 on the project's address.
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=80:8069
      - HTTPS_EXPOSE=443:8069
    expose:
      - "8069"
    # --proxy-mode: Odoo sits behind the DDEV router and reads the scheme and
    #   the host from the forwarded headers, so its links are https.
    # --db-filter: one database only, so visitors are never sent to the
    #   database selector.
    # No --workers: in its default threaded mode Odoo serves the pages and the
    #   websocket of the bus on the same port, which is the one the router
    #   exposes.
    command: odoo --proxy-mode --db-filter=^odoo$$ --max-cron-threads=1
    volumes:
      - "odoo-web-data:/var/lib/odoo"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}

volumes:
  odoo-db:
  odoo-web-data:
