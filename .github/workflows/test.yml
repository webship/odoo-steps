name: Test

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

env:
  FORCE_COLOR: '1'

jobs:
  cucumber:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Trust DDEV's local certificate authority in Node (the status-code checks use it)
        run: echo "NODE_EXTRA_CA_CERTS=$(mkcert -CAROOT)/rootCA.pem" >> "$GITHUB_ENV"

      - name: Start Odoo 17.0 and PostgreSQL with DDEV
        run: ddev start

      - name: Build the Odoo site (demo data, apps, accounts of the users registry)
        run: bash scripts/build-odoo.sh

      - name: Check the step examples and feature steps against the definitions
        run: npm run test:examples

      - name: Check that STEPS.md lists the steps as they are defined
        run: npm run docs:steps:check

      - name: Run cucumber dry-run (no ambiguous or undefined step)
        run: npm run test:dry

      - name: Run the suite against the Odoo site
        env:
          LAUNCH_URL: https://odoo-steps.ddev.site
        run: npm test

      - name: Show the Odoo log
        if: always()
        run: ddev logs -s odoo | tail -200 || true

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            tests/reports/cucumber_report.json
            tests/reports/cucumber_report.html
            screenshots/
          retention-days: 14
